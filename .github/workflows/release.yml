name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build macOS universal binary
    permissions:
      contents: write
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for tauri-plugin-updater to sign the bundle. Without
          # these, the updater would refuse to install the new version.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dictapad ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full list of changes.

            ## Download

            Single universal `.dmg` runs natively on both Apple Silicon and Intel Macs.

            ## Install (macOS)

            1. Open the `.dmg` and drag `Dictapad.app` into `/Applications`.
            2. First launch is blocked by Gatekeeper because the bundle is unsigned by Apple (it's signed by our updater key, but not notarized). Right-click the app → Open → Open. Or run:
               ```bash
               xattr -dr com.apple.quarantine /Applications/Dictapad.app
               ```

            ## Updating

            From this version onward, Dictapad checks for new releases on launch and offers an in-app upgrade button — no need to come back here.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      # tauri-action's own latest.json upload silently no-ops for the
      # universal-apple-darwin target ("Signature not found for the
      # updater JSON. Skipping upload..."). We self-sign the bundle and
      # publish the manifest ourselves so the updater flow is robust to
      # whatever tauri-action does or doesn't do.
      - name: Sign bundle and publish updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          BUNDLE=$(find src-tauri/target -name "Dictapad.app.tar.gz" -type f | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "::error::Bundle Dictapad.app.tar.gz not found under src-tauri/target/"
            find src-tauri/target -maxdepth 6 \( -name "*.tar.gz" -o -name "*.dmg" \) 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "Bundle: $BUNDLE"

          # Sign — write the key to a temp file because the CLI takes a path.
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_FILE"
          pnpm tauri signer sign -f "$KEY_FILE" --password= "$BUNDLE"

          SIG_FILE="${BUNDLE}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "::error::Signing did not produce $SIG_FILE"
            exit 1
          fi

          SIGNATURE=$(tr -d '\n' < "$SIG_FILE")
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/Dictapad_universal.app.tar.gz"

          SIGNATURE="$SIGNATURE" VERSION="$VERSION" REPO="$REPO" DOWNLOAD_URL="$DOWNLOAD_URL" \
            python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          data = {
            "version": os.environ["VERSION"],
            "notes": f"See https://github.com/{os.environ['REPO']}/blob/main/CHANGELOG.md",
            "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "platforms": {
              "darwin-x86_64": {
                "signature": os.environ["SIGNATURE"],
                "url": os.environ["DOWNLOAD_URL"],
              },
              "darwin-aarch64": {
                "signature": os.environ["SIGNATURE"],
                "url": os.environ["DOWNLOAD_URL"],
              },
            },
          }
          with open("latest.json", "w") as f:
            json.dump(data, f, indent=2)
          PY

          gh release upload "$TAG" latest.json "$SIG_FILE" --repo "$REPO" --clobber
