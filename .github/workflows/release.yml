name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build macOS universal binary
    permissions:
      contents: write
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for tauri-plugin-updater to sign the bundle. Without
          # these, the updater would refuse to install the new version.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dictapad ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full list of changes.

            ## Download

            Single universal `.dmg` runs natively on both Apple Silicon and Intel Macs.

            ## Install (macOS)

            1. Open the `.dmg` and drag `Dictapad.app` into `/Applications`.
            2. First launch is blocked by Gatekeeper because the bundle is unsigned by Apple (it's signed by our updater key, but not notarized). Right-click the app → Open → Open. Or run:
               ```bash
               xattr -dr com.apple.quarantine /Applications/Dictapad.app
               ```

            ## Updating

            From this version onward, Dictapad checks for new releases on launch and offers an in-app upgrade button — no need to come back here.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin
