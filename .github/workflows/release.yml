name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.target }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            arch_label: "Apple Silicon"
          - platform: macos-13
            target: x86_64-apple-darwin
            arch_label: "Intel"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dictapad ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full list of changes in this release.

            ## Downloads

            - **${{ matrix.arch_label }}** — `Dictapad_*_${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}.dmg`

            ## Install (macOS)

            1. Download the `.dmg` matching your CPU (Apple Silicon vs Intel).
            2. Open it and drag `Dictapad.app` into `/Applications`.
            3. First launch is blocked by Gatekeeper because the bundle is unsigned. Right-click the app → Open → Open. Or run:
               ```bash
               xattr -dr com.apple.quarantine /Applications/Dictapad.app
               ```
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
